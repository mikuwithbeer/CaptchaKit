name: Test CaptchaKit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swift: "6.0.1"
          - os: macos-15
            xcode: "16.2"
            swift: "6.0.1"
          - os: macos-26
            xcode: "26.6"
            swift: "6.3.3"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Swift (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
          swift --version

      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build Project
        run: swift build -v

      - name: Test Project
        run: swift test -v
